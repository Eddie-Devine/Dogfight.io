<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Dogfight.io</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
	<link rel="stylesheet" href="style.css" />
	<link rel="stylesheet" href="radar.css" />
</head>

<body>
	<canvas id="gameCanvas"></canvas>
	<div id="game-brand">Dogfight.io</div>
	<main class="container-fluid px-4 text-white min-vh-100 d-flex align-items-center">
		<div class="row g-4 align-items-center w-100">
			<div class="col-4 d-flex align-items-center justify-content-center">
				<div class="grid-5x5">
					<div class="grid-cell" id="F22"><img class="cell-icon" src="Models/F22/icon.png" alt="F22 icon">
					</div>
					<div class="grid-cell" id="A10"><img class="cell-icon" src="Models/A10/icon.png" alt="F22 icon">
					</div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
					<div class="grid-cell"></div>
				</div>
			</div>
			<div class="col-4 d-flex align-items-center justify-content-center">
				<div class="d-flex flex-column align-items-stretch gap-3 w-100" style="max-width: 360px;">
					<!-- <canvas id="jet-preview-canvas" class="w-100" style="aspect-ratio: 4 / 3; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(0,0,0,0.15);"></canvas> -->
					<input type="text" class="form-control bg-dark text-white border-secondary text-center"
						id="pilotName" maxlength="20" placeholder="Callsign">
					<button id="takeoffBtn" class="btn btn-primary btn-lg w-100">Take Off</button>
					<div id="modeToggle" class="w-100 d-flex align-items-stretch gap-2" aria-label="Game mode"
						tabindex="0">
						<button type="button" class="btn mode-arrow" data-dir="prev"
							aria-label="Previous mode">◀</button>
						<div
							class="flex-grow-1 mode-display d-flex flex-column justify-content-center align-items-center">
							<div class="text-uppercase text-secondary small fw-semibold">Mode</div>
							<div class="h5 mb-0" id="modeLabel" data-mode="dogfight">FREE FOR ALL</div>
						</div>
						<button type="button" class="btn mode-arrow" data-dir="next" aria-label="Next mode">▶</button>
					</div>
				</div>
			</div>
			<div class="col-4 d-flex align-items-center justify-content-center">
				<div class="d-flex flex-column align-items-stretch gap-3 w-100" style="max-width: 360px;">
					<div id="jet-info-card" class="p-3 bg-dark border border-secondary rounded-3 shadow-sm">
						<div class="text-uppercase text-secondary small fw-semibold mb-1">Selected Jet</div>
						<div class="h4 mb-3" id="jet-name">Select a jet</div>
						<div class="jet-stats">
							<div class="d-flex justify-content-between mb-1">
								<span class="text-secondary">Top Speed</span>
								<span id="jet-speed">—</span>
							</div>
							<div class="d-flex justify-content-between mb-1">
								<span class="text-secondary">Range</span>
								<span id="jet-range">—</span>
							</div>
							<div class="d-flex justify-content-between mb-1">
								<span class="text-secondary">Turn Rate</span>
								<span id="jet-turn">—</span>
							</div>
							<div class="d-flex justify-content-between">
								<span class="text-secondary">Payload</span>
								<span id="jet-payload">—</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div class="radar-wrap" id="radar">
		<div class="radar-bezel"></div>
		<svg class="radar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
			<svg class="radar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
				<defs>
					<!-- sweep gradient: bright leading edge fading to nothing -->
					<radialGradient id="sweepGrad" cx="100" cy="100" r="86" gradientUnits="userSpaceOnUse">
						<stop offset="0%" stop-color="#4de3ff" stop-opacity="0" />
						<stop offset="85%" stop-color="#4de3ff" stop-opacity="0.18" />
						<stop offset="100%" stop-color="#4de3ff" stop-opacity="0.35" />
					</radialGradient>

					<!-- clip to circle -->
					<clipPath id="circleClip">
						<circle cx="100" cy="100" r="86" />
					</clipPath>

					<!-- blip glow -->
					<filter id="blipGlow" x="-100%" y="-100%" width="300%" height="300%">
						<feGaussianBlur stdDeviation="2.5" result="blur" />
						<feMerge>
							<feMergeNode in="blur" />
							<feMergeNode in="SourceGraphic" />
						</feMerge>
					</filter>

					<!-- subtle line glow -->
					<filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
						<feGaussianBlur stdDeviation="1" result="blur" />
						<feMerge>
							<feMergeNode in="blur" />
							<feMergeNode in="SourceGraphic" />
						</feMerge>
					</filter>
				</defs>

				<g clip-path="url(#circleClip)">

					<!-- range rings -->
					<circle cx="100" cy="100" r="28.7" fill="none" stroke="rgba(77,227,255,0.10)" stroke-width="0.75" />
					<circle cx="100" cy="100" r="57.3" fill="none" stroke="rgba(77,227,255,0.10)" stroke-width="0.75" />
					<circle cx="100" cy="100" r="86" fill="none" stroke="rgba(77,227,255,0.14)" stroke-width="1" />

					<!-- crosshairs -->
					<line x1="100" y1="14" x2="100" y2="186" stroke="rgba(77,227,255,0.08)" stroke-width="0.75" />
					<line x1="14" y1="100" x2="186" y2="100" stroke="rgba(77,227,255,0.08)" stroke-width="0.75" />

					<!-- diagonal faint lines -->
					<line x1="39" y1="39" x2="161" y2="161" stroke="rgba(77,227,255,0.04)" stroke-width="0.5" />
					<line x1="161" y1="39" x2="39" y2="161" stroke="rgba(77,227,255,0.04)" stroke-width="0.5" />

					<!-- sweep trail (arc sector behind the line) -->
					<g class="trail">
						<!-- 70-degree fading sector -->
						<path d="M100,100 L100,14 A86,86 0 0,0 19.2,56.6 Z" fill="url(#sweepGrad)" opacity="0.6" />
					</g>

					<!-- sweep line -->
					<g class="sweep" filter="url(#lineGlow)">
						<line x1="100" y1="100" x2="100" y2="14" stroke="#4de3ff" stroke-width="1.25"
							stroke-opacity="0.9" />
						<!-- bright dot at tip -->
						<circle cx="100" cy="16" r="1.5" fill="#4de3ff" opacity="0.9" />
					</g>

					<!-- center dot -->
					<circle cx="100" cy="100" r="2.5" fill="#4de3ff" opacity="0.7" />
					<circle cx="100" cy="100" r="1" fill="#ffffff" opacity="0.9" />

					<!-- blips -->
					<g filter="url(#blipGlow)">
						<!-- blip 1 -->
						<!-- <g class="blip blip-1">
							<circle cx="132" cy="68" r="2.5" fill="#4de3ff" />
							<circle cx="132" cy="68" r="1" fill="#ffffff" />
						</g> -->
					</g>

				</g><!-- end clip -->

				<!-- outer ring on top -->
				<circle cx="100" cy="100" r="86" fill="none" stroke="rgba(77,227,255,0.22)" stroke-width="1" />

				<!-- cardinal tick marks outside ring -->
				<line x1="100" y1="12" x2="100" y2="8" stroke="rgba(77,227,255,0.5)" stroke-width="1.5" />
				<line x1="100" y1="188" x2="100" y2="192" stroke="rgba(77,227,255,0.3)" stroke-width="1" />
				<line x1="12" y1="100" x2="8" y2="100" stroke="rgba(77,227,255,0.3)" stroke-width="1" />
				<line x1="188" y1="100" x2="192" y2="100" stroke="rgba(77,227,255,0.3)" stroke-width="1" />

			</svg>
		</svg>
		<span class="cardinal cardinal-n">N</span>
		<span class="cardinal cardinal-s">S</span>
		<span class="cardinal cardinal-e">E</span>
		<span class="cardinal cardinal-w">W</span>
		<div class="radar-corners"></div>
		<div class="radar-label">RDR · AN/APG-63</div>
	</div>

	<script type="importmap">
		{
		"imports": {
			"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
		}
		}
	</script>

	<script type="module" src="main.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>

</html>
